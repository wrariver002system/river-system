<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>河川分署業務查詢系統</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            margin: 0;
            font-family: "Microsoft JhengHei", sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: #1565c0;
            color: white;
            padding: 16px 20px;
            font-size: 22px;
            font-weight: bold;
        }

        .toolbar {
            padding: 15px 20px;
            background: white;
        }

        select {
            padding: 8px 12px;
            font-size: 16px;
        }

.data-entry {
    background: white;
    margin: 20px;
    padding: 20px;
    border-radius: 8px;
}

.data-entry h2 {
    margin-top: 0;
}

.form-row {
    margin-bottom: 15px;
}

.form-row label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

.form-row input,
.form-row textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    font-size: 16px;
}

.data-entry button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}

#saveMessage {
    margin-top: 12px;
    font-weight: bold;
}

        #map {
            height: 500px;
        }
    </style>
</head>

<body>

    <div class="header">
        河川分署業務查詢系統
    </div>

    <div class="toolbar">

        <label for="division">河川分署：</label>

        <select id="division">
            <option value="">請選擇河川分署</option>
            <option value="1">第一河川分署</option>
            <option value="2">第二河川分署</option>
            <option value="3">第三河川分署</option>
            <option value="4">第四河川分署</option>
            <option value="5">第五河川分署</option>
            <option value="6">第六河川分署</option>
            <option value="7">第七河川分署</option>
            <option value="8">第八河川分署</option>
            <option value="9">第九河川分署</option>
            <option value="10">第十河川分署</option>
        </select>

    </div>

    <div id="map"></div>

<div class="data-entry">

    <h2>業務資料登錄</h2>

    <form
        id="businessForm"
        action="https://script.google.com/macros/s/AKfycbzk4Ek12ShjL9wpQmU-d-eMhZAfVZ-g1JoGnCjgqoIsNmF6veB033Mt-GcyO_D94dPV/exec"
        method="POST"
        target="hiddenFrame"
    >

        <div class="form-row">
            <label>案件名稱</label>
            <input
                type="text"
                name="caseName"
                required
            >
        </div>

        <div class="form-row">
            <label>承辦單位</label>
            <input
                type="text"
                name="unit"
            >
        </div>

        <div class="form-row">
            <label>辦理情形</label>
            <input
                type="text"
                name="status"
            >
        </div>

        <div class="form-row">
            <label>備註</label>
            <textarea
                name="note"
                rows="4"
            ></textarea>
        </div>

        <button type="submit">
            儲存資料
        </button>

    </form>

    <div id="saveMessage"></div>

</div>

<iframe
    name="hiddenFrame"
    id="hiddenFrame"
    style="display:none;">
</iframe>

    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>

let formSubmitted = false;

const businessForm = document.getElementById("businessForm");
const hiddenFrame = document.getElementById("hiddenFrame");
const saveMessage = document.getElementById("saveMessage");

businessForm.addEventListener("submit", function () {

    formSubmitted = true;

    saveMessage.textContent = "資料儲存中...";

});

hiddenFrame.addEventListener("load", function () {

    if (!formSubmitted) {
        return;
    }

    formSubmitted = false;

    saveMessage.textContent = "資料已送出。";

    businessForm.reset();

});

        // 建立地圖
        const map = L.map('map').setView(
            [23.7, 120.9],
            7
        );

        // 加入 OpenStreetMap
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // 河川分署位置
        // 第一版先使用大概位置測試
        const divisions = {

            1: {
                name: "第一河川分署",
                lat: 24.75,
                lng: 121.75
            },

            2: {
                name: "第二河川分署",
                lat: 24.8,
                lng: 121.0
            },

            3: {
                name: "第三河川分署",
                lat: 24.2,
                lng: 120.7
            },

            4: {
                name: "第四河川分署",
                lat: 23.9,
                lng: 120.5
            },

            5: {
                name: "第五河川分署",
                lat: 23.5,
                lng: 120.4
            },

            6: {
                name: "第六河川分署",
                lat: 23.0,
                lng: 120.2
            },

            7: {
                name: "第七河川分署",
                lat: 22.65,
                lng: 120.3
            },

            8: {
                name: "第八河川分署",
                lat: 22.75,
                lng: 121.1
            },

            9: {
                name: "第九河川分署",
                lat: 23.98,
                lng: 121.6
            },

            10: {
                name: "第十河川分署",
                lat: 25.05,
                lng: 121.5
            }

        };


        let currentMarker;


        // 下拉選單事件
        document
            .getElementById("division")
            .addEventListener("change", function () {

                const id = this.value;

                if (!id) {
                    map.setView([23.7, 120.9], 7);
                    return;
                }

                const data = divisions[id];

                // 移動地圖
                map.flyTo(
                    [data.lat, data.lng],
                    10
                );


                // 移除舊標記
                if (currentMarker) {
                    map.removeLayer(currentMarker);
                }


                // 加入新標記
                currentMarker = L.marker(
                    [data.lat, data.lng]
                )
                .addTo(map)
                .bindPopup(data.name)
                .openPopup();

            });

    </script>

</body>
</html>
